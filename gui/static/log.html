<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mwt-biogas · Event log (read-only)</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="log-page">
<header class="top">
  <span id="source" class="badge badge-unknown">SOURCE UNKNOWN</span>
  <span id="conn" class="conn conn-waiting">Waiting…</span>
  <b>Event log</b>
  <span class="chip role">Read-only (no login)</span>
  <span class="muted">Times shown in <span id="tz"></span></span>
</header>
<form id="filters" class="filters">
  <label>From <input type="datetime-local" id="f-since" step="1"></label>
  <label>To <input type="datetime-local" id="f-until" step="1"></label>
  <label>Severity <select id="f-severity"><option value="">Any</option><option>CRITICAL</option><option>WARNING</option></select></label>
  <label>Equipment <select id="f-equipment"><option value="">Any</option></select></label>
  <label>Event <select id="f-kind"><option value="">Any</option></select></label>
  <button type="submit">Apply</button>
  <button type="button" id="f-clear" class="secondary">Clear</button>
  <a id="export" class="button secondary" href="/api/export.csv">Export CSV (current filter)</a>
</form>
<div class="log-bar">
  <span id="live-state" class="chip">Live follow on</span>
  <button id="resume" class="secondary" hidden>Resume live</button>
  <button id="newest" class="secondary">Newest</button>
  <button id="older" class="secondary">Older ▸</button>
  <span id="page-info" class="muted"></span>
</div>
<div id="log-scroll" class="log-scroll">
  <table class="log">
    <thead><tr><th>Time</th><th>Source / clock</th><th>Severity</th><th>Equipment</th><th>Event</th><th>Description</th><th>Troubleshooting</th></tr></thead>
    <tbody id="log-rows"></tbody>
  </table>
</div>
<script src="/static/common.js"></script>
<script src="/static/log.js"></script>
</body>
</html>
